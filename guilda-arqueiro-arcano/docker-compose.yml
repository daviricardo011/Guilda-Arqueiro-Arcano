version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: guilda-arqueiro-arcano-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: guilda_arqueiro_arcano
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
